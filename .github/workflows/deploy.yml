
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ vars.EC2_USERNAME }}@${{ vars.EC2_HOST }} "hostname"
